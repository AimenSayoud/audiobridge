<h2>Installed</h2>
<p>AudioBridge is in your Applications folder and should have opened.</p>
<p>Press <b>Start</b>, open the <b>Pairing</b> tab, and scan the code with your
phone. Plug the phone in over USB and it will use the cable automatically.</p>
<p>If you would rather it stayed out of the way, turn on
<b>General &rsaquo; Menu bar only</b>.</p>
