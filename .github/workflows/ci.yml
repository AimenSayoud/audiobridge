name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal, ad-hoc signed)
        working-directory: macos
        run: ./build.sh --universal
      - name: Protocol self-test
        working-directory: macos
        run: ./Tethertone.app/Contents/MacOS/Tethertone --selftest

  android:
    name: Android app and shared module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew :shared:jvmTest
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: android/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  probe:
    name: probe.py syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/probe.py
